[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "py_libraries"
version = "0.1.0"
# requirements.txt pins numpy 2.4, pandas 3.0, scipy 1.17 and scikit-learn 1.8,
# which all need Python 3.11 or later
requires-python = ">=3.11"

dependencies = [
]

[project.optional-dependencies]

# module ones
cipher = [
]

other = [
]

type = [
    'numpy>=2.4.4',
    'pandas>=3.0.2',
    'scipy>=1.17.1',
    'regex>=2024.11.6',
]

# classic
docs = [
    'mkdocs>=1.6,<=1.6.1',
    'mkdocs-material>=9.5,<10',
    'mkdocstrings[python]>=0.25',
    'mkdocs-gen-files>=0.5',
    'mkdocs-literate-nav>=0.6',
    'mkdocs-section-index>=0.3',
    'ruff~=0.16.0',
]

dev = [
    'py_libraries[cipher]',
    'py_libraries[other]',
    'py_libraries[type]',
]

test = [
    'pytest>=8.3.4',
]

all = [
    'py_libraries[dev]',
    'py_libraries[docs]',
    'py_libraries[test]',
]

# The repository root is itself the `py_libraries` package (it holds the
# top-level __init__.py), so map the package name to the root directory.
[tool.setuptools]
packages = ["py_libraries"]

[tool.setuptools.package-dir]
py_libraries = "."

[tool.ruff]
line-length = 88
target-version = "py311"
# Only the modules that already have tests are checked. Add a module here, and its
# tests under tests/, when it is migrated to the coding standards.
include = [
    "cipher/*.py",
    "other/*.py",
    "tests/**/*.py",
    "type/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "N802",  # camelCase function/method names: intentional
    "N806",  # camelCase local variables assigned from a camelCase function
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
# mypy follows the imports of the tests, so it checks exactly the modules that
# already have tests. Other modules are not checked until they get tests.
files = ["tests"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# pandas ships no inline types and pandas-stubs is not a project dependency
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root has an __init__.py, so the default "prepend" mode names the
# test modules after the parent folders of the checkout (e.g. `code.py_libraries`).
# "importlib" avoids that and does not touch sys.path.
addopts = "--import-mode=importlib"
